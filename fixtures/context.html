<!doctype html>
<html lang="en" class="app-root">
<head>
  <meta charset="utf-8">
  <title>zedpdf styling-context fixtures</title>
  <link rel="stylesheet" href="./invoice.css">
  <style>
    /* (1) Vue-style scoped CSS: attribute selectors generated by the SFC compiler. */
    .card[data-v-7a1b2c] { border: 3px solid rgb(10, 120, 60); padding: 12px; border-radius: 8px; }
    .card .title[data-v-7a1b2c] { color: rgb(10, 120, 60); margin: 0 0 6px; font-size: 22px; }
    .card p[data-v-7a1b2c] { margin: 0; }

    /* (2) React-style theme inherited from an ancestor: class + CSS custom properties + font. */
    .theme-dark { --accent: rgb(220, 40, 100); --surface: rgb(20, 24, 33); font-family: 'Noto Sans', sans-serif; color: rgb(235, 235, 240); }
    .theme-dark .inv { background: var(--surface); padding: 16px; }
    .inv h2 { color: var(--accent); margin: 0 0 8px; font-size: 24px; }
    main.layout { display: grid; grid-template-columns: 200px 1fr; gap: 20px; padding: 30px; }

    /* (3) Print-specific rules on the direct path. */
    .only-screen { color: red; }
    @media screen { .print-hide-me { display: block; } }
    @media print { .print-hide-me { display: none; } .print-only-text { display: block !important; } .inv h2 { text-decoration: underline; } }
    .print-only-text { display: none; }

    #transp { background: rgb(255, 230, 200); padding: 0; }
    #transp img { width: 240px; height: 80px; display: block; }
  </style>
</head>
<body>
  <div id="scoped-host" data-v-app>
    <section class="card" data-v-7a1b2c id="vue-card">
      <h2 class="title" data-v-7a1b2c>Scoped Vue heading</h2>
      <p data-v-7a1b2c>Scoped paragraph text.</p>
    </section>
  </div>

  <div class="theme-dark" style="--extra: 1">
    <main class="layout">
      <aside>Sidebar not exported</aside>
      <section id="react-invoice" class="inv">
        <h2>Themed React heading</h2>
        <p>Inherited font and colour from the theme ancestor.</p>
        <div class="print-hide-me">SCREEN-ONLY-LINE</div>
        <div class="print-only-text">PRINT-ONLY-LINE</div>
      </section>
    </main>
  </div>

  <div id="transp">
    <img src="./assets/logo.png" alt="logo">
    <img src="./assets/logo.png" alt="logo again">
  </div>
  <script>document.documentElement.dataset.ready = '1';</script>
</body>
</html>
