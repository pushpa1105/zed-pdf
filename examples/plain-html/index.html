<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>zedpdf: plain HTML example</title>
  <style>
    @font-face { font-family: 'Noto Sans'; src: url('./public/fonts/NotoSans_400Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'Noto Sans'; src: url('./public/fonts/NotoSans_700Bold.ttf') format('truetype'); font-weight: 700; }
    body { font-family: system-ui, sans-serif; background: #f1f3f6; margin: 0; padding: 24px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
    #invoice { font-family: 'Noto Sans', sans-serif; font-size: 12px; background: #fff; max-width: 760px; padding: 28px; color: #1d2733; }
    #invoice header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #105ea6; padding-bottom: 10px; }
    #invoice header img { width: 160px; }
    #invoice h1 { color: #105ea6; letter-spacing: 2px; margin: 0; }
    #invoice table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    #invoice th { background: #105ea6; color: #fff; text-align: left; padding: 6px 8px; }
    #invoice td { border-bottom: 1px solid #d5dce4; padding: 6px 8px; }
    #invoice .num { text-align: right; }
    #invoice tr { break-inside: avoid; }
    #invoice .total { font-size: 15px; font-weight: 700; text-align: right; margin-top: 12px; break-inside: avoid; }
    @media print { .toolbar { display: none; } body { background: none; padding: 0; } }
  </style>
</head>
<body>
  <!-- No JavaScript needed for these buttons: data-zedpdf actions are bound by the script-tag build. -->
  <div class="toolbar">
    <button id="download" data-zedpdf="download" data-zedpdf-target="#invoice" data-zedpdf-filename="invoice-plain" data-zedpdf-margin="12mm">Download PDF</button>
    <button data-zedpdf="preview" data-zedpdf-target="#invoice" data-zedpdf-preview="#viewer">Preview</button>
    <button data-zedpdf="open" data-zedpdf-target="#invoice">Open in new tab</button>
    <button data-zedpdf="print" data-zedpdf-target="#invoice" data-zedpdf-margin="12mm">Print…</button>
    <output id="status"></output>
  </div>
  <div id="viewer" style="height:0"></div>
  <article id="invoice">
    <header><img src="./public/logo.png" alt="Logo"><h1>INVOICE</h1></header>
    <p><b>Bill to:</b> Acme Retail Pvt. Ltd., 221B Market Road, Lalitpur</p>
    <table>
      <thead><tr><th>Item</th><th>Description</th><th class="num">Amount</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="total" id="total"></p>
  </article>

  <script src="./node_modules/zedpdf/dist/zedpdf.global.js"></script>
  <script>
    // Demo data only. The PDF buttons above need no code.
    let sum = 0;
    document.getElementById('rows').innerHTML = Array.from({ length: 60 }, (_, i) => {
      const amt = ((i * 37) % 500) + 10.5;
      sum += amt;
      return '<tr><td>PLAIN-' + String(i + 1).padStart(3, '0') + '</td><td>Line item ' + (i + 1) + '</td><td class="num">' + amt.toFixed(2) + '</td></tr>';
    }).join('');
    document.getElementById('total').textContent = 'Total NPR ' + sum.toFixed(2);
    // Optional: react to results.
    document.addEventListener('zedpdf:done', (e) => {
      const r = e.detail.result;
      if (r && r.pageCount) document.getElementById('status').value = r.pageCount + ' pages, ' + r.warnings.length + ' warnings';
      if (e.detail.action === 'preview') document.getElementById('viewer').style.height = '600px';
    });
  </script>
</body>
</html>
